
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:var(--color-background-tertiary);
  --card:var(--color-background-primary);
  --border:var(--color-border-tertiary);
  --border2:var(--color-border-secondary);
  --gold:#c9a84c;--gold2:#e8c96a;--gold-bg:rgba(201,168,76,0.1);
  --text:var(--color-text-primary);
  --muted:var(--color-text-secondary);
  --muted2:var(--color-text-tertiary);
  --hotel:#0ea5e9;--docencia:#22c55e;--admin:#8b5cf6;
}
body{font-family:var(--font-sans);background:transparent;color:var(--text);min-height:100vh}
.app{display:flex;flex-direction:column;min-height:600px}
header{background:var(--card);border-bottom:1px solid var(--border2);padding:0 20px;position:sticky;top:0;z-index:10}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;height:56px;max-width:1000px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.avatar-ring{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:var(--gold-bg)}
.avatar-ring img{width:100%;height:100%;object-fit:cover}
.avatar-ring span{font-size:13px;font-weight:500;color:var(--gold)}
.brand-text{line-height:1.2}
.brand-name{font-family:var(--font-serif);font-size:15px;font-weight:500;color:var(--text)}
.brand-role{font-size:11px;color:var(--gold)}
nav{display:flex;gap:2px}
.nav-btn{background:none;border:none;cursor:pointer;padding:7px 12px;border-radius:var(--border-radius-md);font-family:var(--font-sans);font-size:12px;font-weight:500;color:var(--muted);transition:all .2s;display:flex;align-items:center;gap:5px}
.nav-btn:hover{color:var(--text);background:var(--color-background-secondary)}
.nav-btn.active{color:var(--text);background:var(--color-background-secondary);border-bottom:2px solid var(--gold)}

main{max-width:1000px;margin:0 auto;padding:28px 20px;width:100%}
.tab{display:none}.tab.active{display:block}

/* SECTION HEADER */
.sh{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.sh-title{font-family:var(--font-serif);font-size:28px;font-weight:500;white-space:nowrap;color:var(--text)}
.sh-line{flex:1;height:0.5px;background:linear-gradient(to right,var(--gold),transparent)}

/* CARD */
.card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);padding:20px}
.card+.card{margin-top:14px}

/* NOTICE BANNER */
.notice{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--border-radius-md);border:0.5px solid;margin-bottom:14px;font-size:12px}
.notice-drive{background:rgba(59,130,246,0.06);border-color:rgba(59,130,246,0.25);color:#185fa5}
.notice-photo{background:rgba(201,168,76,0.07);border-color:rgba(201,168,76,0.3);color:#8a6a1a}
.notice svg{width:14px;height:14px;flex-shrink:0}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:500;border:0.5px solid}
.badge-gold{background:var(--gold-bg);border-color:rgba(201,168,76,0.35);color:#8a6a1a}
.badge-hotel{background:rgba(14,165,233,0.08);border-color:rgba(14,165,233,0.3);color:#0369a1}
.badge-docencia{background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.3);color:#15803d}
.badge-admin{background:rgba(139,92,246,0.08);border-color:rgba(139,92,246,0.3);color:#6d28d9}
.badge-legal{background:rgba(100,116,139,0.08);border-color:rgba(100,116,139,0.25);color:#475569}

/* COMPETENCIAS TAB */
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.comp-grid{grid-template-columns:1fr}}
.comp-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);padding:20px}
.comp-card-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.comp-stripe{width:3px;height:20px;border-radius:2px;background:var(--gold);flex-shrink:0}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 12px;border-radius:100px;border:0.5px solid var(--border2);font-size:11px;font-weight:400;color:var(--muted);transition:all .2s;cursor:default}
.tag:hover{border-color:rgba(201,168,76,0.4);color:var(--gold)}
.lang-row{margin-bottom:12px}
.lang-hdr{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px}
.lang-name{font-weight:500;color:var(--text)}
.lang-level{color:var(--muted)}
.lang-track{height:6px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden}
.lang-fill{height:100%;border-radius:3px;background:linear-gradient(to right,var(--gold),var(--gold2))}

/* DOCENCIA FP SECTION — new */
.fp-hero{background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);padding:24px;margin-bottom:14px;border-left:3px solid var(--docencia)}
.fp-title{font-family:var(--font-serif);font-size:18px;font-weight:500;color:var(--text);margin-bottom:6px}
.fp-sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.fp-legal{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.fp-modules{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:700px){.fp-modules{grid-template-columns:1fr}}
.fp-module{background:var(--color-background-secondary);border:0.5px solid var(--border);border-radius:var(--border-radius-md);padding:14px}
.fp-module-code{font-size:10px;font-weight:500;color:var(--gold);margin-bottom:4px;font-family:var(--font-mono)}
.fp-module-name{font-size:12px;font-weight:500;color:var(--text);margin-bottom:4px;line-height:1.4}
.fp-module-meta{font-size:10px;color:var(--muted)}
.fp-warning{display:flex;gap:8px;padding:10px 14px;background:rgba(245,158,11,0.07);border:0.5px solid rgba(245,158,11,0.3);border-radius:var(--border-radius-md);font-size:11px;color:#92400e;line-height:1.5;margin-top:14px}
.fp-warning svg{width:14px;height:14px;flex-shrink:0;margin-top:1px;color:#d97706}

/* UC TABLE */
.uc-wrap{overflow-x:auto;border-radius:var(--border-radius-md);border:0.5px solid var(--border)}
.uc-table{width:100%;border-collapse:collapse;font-size:11px}
.uc-table th{text-align:left;padding:9px 12px;font-weight:500;font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:.5px;border-bottom:0.5px solid var(--border);background:var(--color-background-secondary)}
.uc-table td{padding:9px 12px;border-bottom:0.5px solid var(--border);color:var(--muted);vertical-align:top}
.uc-table tr:last-child td{border-bottom:none}
.uc-table tr:hover td{background:var(--color-background-secondary)}
.uc-code{font-family:var(--font-mono);color:var(--gold);font-size:10px}

/* BLOG TAB */
.blog-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.blog-grid{grid-template-columns:1fr}}
.post-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);padding:18px;transition:all .2s;cursor:pointer}
.post-card:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.post-type{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.6px;color:var(--muted2);margin-bottom:8px}
.post-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:6px;line-height:1.4}
.post-excerpt{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.post-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted2)}
.post-dot{width:4px;height:4px;border-radius:50%;background:var(--border2)}

.linkedin-banner{background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);padding:20px;margin-bottom:20px}
.li-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.li-icon{width:36px;height:36px;border-radius:var(--border-radius-md);background:rgba(0,119,181,0.1);border:0.5px solid rgba(0,119,181,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.li-title{font-size:14px;font-weight:500;color:var(--text)}
.li-sub{font-size:11px;color:var(--muted)}
.li-notice{display:flex;gap:8px;align-items:flex-start;padding:10px 14px;background:rgba(59,130,246,0.06);border:0.5px solid rgba(59,130,246,0.2);border-radius:var(--border-radius-md);font-size:11px;color:var(--muted);line-height:1.5}
.li-notice svg{width:13px;height:13px;flex-shrink:0;color:#185fa5;margin-top:1px}
.li-post-preview{border:0.5px solid var(--border);border-radius:var(--border-radius-md);padding:14px;margin-top:10px}
.li-avatar{width:32px;height:32px;border-radius:50%;border:0.5px solid var(--border);background:var(--gold-bg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--gold);font-weight:500;flex-shrink:0}
.li-post-text{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
.li-post-date{font-size:10px;color:var(--muted2);margin-top:8px}

/* HERO (Inicio) */
.hero-wrap{background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:18px}
.hero-inner{display:flex;gap:0;min-height:280px}
.hero-img-col{width:200px;flex-shrink:0;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border-right:0.5px solid var(--border);padding:20px}
.hero-img-placeholder{width:100px;height:100px;border-radius:50%;border:2px dashed var(--border2);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.hero-img-placeholder svg{width:24px;height:24px;color:var(--muted2)}
.hero-img-label{font-size:10px;color:var(--muted2);text-align:center;line-height:1.4}
.hero-content{padding:32px 28px;flex:1}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:100px;border:0.5px solid rgba(201,168,76,0.35);background:var(--gold-bg);color:#8a6a1a;font-size:11px;font-weight:500;margin-bottom:14px}
.hero-name{font-family:var(--font-serif);font-size:38px;font-weight:500;color:var(--text);line-height:1.05;margin-bottom:6px}
.hero-name-gold{color:var(--gold)}
.hero-role{font-size:15px;color:var(--muted);margin-bottom:4px}
.hero-sub{font-size:12px;color:var(--muted2);margin-bottom:20px}
.contact-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.cpill{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--border-radius-md);border:0.5px solid var(--border);font-size:11px;color:var(--muted)}
.cpill svg{width:12px;height:12px;color:var(--gold)}
.cta-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:8px 18px;border-radius:var(--border-radius-md);font-family:var(--font-sans);font-weight:500;font-size:12px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:0.5px solid var(--border2);background:transparent;color:var(--text)}
.btn:hover{background:var(--color-background-secondary)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#0d1117}
.btn-gold:hover{background:var(--gold2)}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);padding:16px;display:flex;align-items:center;gap:12px}
.stat-icon{width:38px;height:38px;border-radius:var(--border-radius-md);background:var(--gold-bg);border:0.5px solid rgba(201,168,76,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:18px;height:18px;color:var(--gold)}
.stat-val{font-family:var(--font-serif);font-size:26px;font-weight:500;color:var(--text);line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);margin-bottom:2px}

/* EXPERIENCIA */
.job-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);overflow:hidden;display:flex;margin-bottom:14px;transition:all .2s}
.job-card:hover{border-color:var(--border2)}
.job-img{width:38%;position:relative;min-height:200px;flex-shrink:0;background:var(--color-background-secondary)}
.job-img-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:200px}
.job-img-placeholder svg{width:28px;height:28px;color:var(--muted2)}
.job-img-label{font-size:10px;color:var(--muted2);text-align:center;line-height:1.4;padding:0 12px}
.job-body{padding:24px;flex:1}
.job-title{font-family:var(--font-serif);font-size:18px;font-weight:500;color:var(--text);margin-bottom:3px}
.job-company{color:var(--gold);font-size:13px;font-weight:500;margin-bottom:5px}
.job-loc{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:12px}
.job-loc svg{width:10px;height:10px;color:var(--gold)}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.task-item{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--muted)}
.task-item svg{width:12px;height:12px;color:var(--green);flex-shrink:0;margin-top:1px}
.others-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.other-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);overflow:hidden;transition:all .2s}
.other-card:hover{border-color:var(--border2)}
.other-img{height:120px;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;position:relative}
.other-img svg{width:22px;height:22px;color:var(--muted2)}
.other-body{padding:12px}
.other-name{font-size:12px;font-weight:500;color:var(--text);margin-bottom:3px}
.other-loc{font-size:10px;color:var(--muted);margin-bottom:4px;line-height:1.3}
.other-period{font-size:10px;color:var(--muted2)}
.star-chip{position:absolute;top:8px;right:8px;background:rgba(201,168,76,0.15);border:0.5px solid rgba(201,168,76,0.4);border-radius:100px;font-size:9px;font-weight:500;color:#8a6a1a;padding:2px 7px}

/* FORMACION */
.deg-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);padding:22px;display:flex;align-items:center;gap:20px;margin-bottom:14px;transition:all .2s}
.deg-card:hover{border-color:var(--border2)}
.deg-icon{width:60px;height:60px;border-radius:var(--border-radius-lg);background:var(--gold-bg);border:0.5px solid rgba(201,168,76,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.deg-icon svg{width:28px;height:28px;color:var(--gold)}
.cert-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.cert-grid{grid-template-columns:1fr}}
.cert-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--border-radius-lg);padding:18px;transition:all .2s}
.cert-card:hover{border-color:var(--border2)}
.cert-hdr{display:flex;gap:12px;margin-bottom:12px}
.cert-icon-wrap{width:42px;height:42px;border-radius:var(--border-radius-md);background:var(--gold-bg);border:0.5px solid rgba(201,168,76,0.25);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cert-icon-wrap svg{width:20px;height:20px;color:var(--gold)}
.cert-code{font-size:11px;font-weight:500;color:var(--text);margin-bottom:2px}
.cert-org{font-size:10px;color:var(--gold)}
.cert-decree{font-size:10px;color:var(--muted2)}
.cert-diploma{margin-top:10px;padding:8px 10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:0.5px dashed var(--border2);font-size:10px;color:var(--muted2);display:flex;align-items:center;gap:6px;cursor:pointer}
.cert-diploma svg{width:12px;height:12px;color:var(--muted2)}
.cert-items{display:flex;flex-direction:column;gap:6px}
.cert-item{display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--muted)}
.cert-item svg{width:12px;height:12px;color:var(--docencia);flex-shrink:0;margin-top:1px}
</style>

<div class="app">
<header>
  <div class="hdr-inner">
    <div class="brand">
      <div class="avatar-ring">
        <span>FM</span>
      </div>
      <div class="brand-text">
        <div class="brand-name">Francisco Javier Martínez Alba</div>
        <div class="brand-role">Director de Hotel · Formador FP · Project Manager</div>
      </div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main id="content"></main>
</div>

<script>
const TABS=[
  {id:'inicio',label:'Inicio'},
  {id:'experiencia',label:'Experiencia'},
  {id:'formacion',label:'Formación'},
  {id:'competencias',label:'Competencias'},
  {id:'blog',label:'Blog'},
];
let active='inicio';

function nav(){
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="nav-btn${active===t.id?' active':''}" onclick="go('${t.id}')">${t.label}</button>`).join('');
}
function go(id){active=id;nav();render();window.scrollTo({top:0,behavior:'smooth'});}

const SVGS={
  cap:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
  award:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>`,
  briefcase:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>`,
  users:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>`,
  shield:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
  mail:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>`,
  phone:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 11.5 19.79 19.79 0 01.14 3a2 2 0 012-2.18h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.37a16 16 0 006.72 6.72l1.74-1.74a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>`,
  pin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  img:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
  file:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
